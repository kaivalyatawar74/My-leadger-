
name: Build My Ledger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: build-my-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare web files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root."
            exit 1
          fi

          mkdir -p www

          # Copy web application files and asset folders.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='www/' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.*' \
            --exclude='README*' \
            --exclude='.gitignore' \
            ./ www/

          echo "Web files prepared:"
          find www -maxdepth 3 -type f | sort

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          npm init -y

          npm install --save-exact \
            @capacitor/core@6 \
            @capacitor/android@6 \
            @capacitor/filesystem@6 \
            @capacitor/share@6

          npm install --save-dev --save-exact @capacitor/cli@6

          npx cap init "My Ledger" com.kaivalya.myledger \
            --web-dir=www

          npx cap add android
          npx cap sync android

      - name: Set Android app icon
        shell: bash
        run: |
          set -euo pipefail

          if [ -f icon-512.png ] && [ -f icon-maskable-512.png ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
            fi

            for d in \
              mdpi:48:108 \
              hdpi:72:162 \
              xhdpi:96:216 \
              xxhdpi:144:324 \
              xxxhdpi:192:432
            do
              IFS=: read -r density size foreground_size <<< "$d"

              dir="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$dir"

              convert icon-512.png \
                -resize "${size}x${size}" \
                "$dir/ic_launcher.png"

              convert icon-512.png \
                -resize "${size}x${size}" \
                "$dir/ic_launcher_round.png"

              convert icon-maskable-512.png \
                -resize "${foreground_size}x${foreground_size}" \
                "$dir/ic_launcher_foreground.png"
            done

            mkdir -p android/app/src/main/res/values

            cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#04211C</color>
          </resources>
          EOF

            echo "Custom app icons prepared."
          else
            echo "Custom icons not found; using default Android icon."
          fi

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" My-Ledger.apk
          ls -lh My-Ledger.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Ledger-APK
          path: My-Ledger.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="apk-${RUN_NUMBER}-${RUN_ATTEMPT}"

          gh release create "$TAG" My-Ledger.apk \
            --title "My Ledger APK #${RUN_NUMBER}" \
            --notes "My Ledger Android debug APK. Download My-Ledger.apk and install it on your Android device."
