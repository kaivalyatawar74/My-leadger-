name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "My Ledger" com.kaivalya.myledger --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n l f <<< "$d"
            dir=android/app/src/main/res/mipmap-$n
            convert icon-512.png -resize ${l}x${l} $dir/ic_launcher.png
            convert icon-512.png -resize ${l}x${l} $dir/ic_launcher_round.png
            convert icon-maskable-512.png -resize ${f}x${f} $dir/ic_launcher_foreground.png
          done
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#04211C</color>
          </resources>
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Ledger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: My-Ledger-APK
          path: My-Ledger.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" My-Ledger.apk \
            --title "My Ledger APK #${{ github.run_number }}" \
            --notes "Download My-Ledger.apk below and install it on your phone."
